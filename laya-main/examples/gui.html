<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Báo Cáo Phản Hồi Khách Hàng</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 25px; background: #f8fafc; color: #1e293b; }
        .card { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #0f172a; margin-top: 0; font-size: 24px; }
        p { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        button { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 15px; font-size: 15px; }
        button:hover { background: #1d4ed8; }
        .nav-link { display: inline-block; margin-top: 25px; color: #64748b; text-decoration: none; font-size: 13px; }
        .nav-link:hover { text-decoration: underline; color: #2563eb; }
        .result-box { margin-top: 20px; padding: 15px; background: #f1f5f9; border-left: 4px solid #2563eb; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nexus - Trợ Lý Hiểu Khách Hàng (No-Code)</h1>
        <p>Dán danh sách bình luận / đánh giá của khách hàng vào đây để nhận báo cáo phân tích tự động.</p>
        <textarea id="inputText" placeholder="Ví dụ:&#10;Giao hàng siêu nhanh, đóng gói rất cẩn thận!&#10;Áo bị rộng so with bảng quy đổi kích thước, vải mỏng.&#10;Nhân viên tư vấn nhiệt tình."></textarea>
        <br>
        <button onclick="processFeedback()">Phân Tích Ngay</button>
        
        <div id="resultBox" class="result-box">
            <strong>Đã nhận dữ liệu!</strong> Hệ thống Nexus đang tự động gán nhãn và xuất báo cáo...
        </div>

        <br>
        <a class="nav-link" href="/" target="_blank">⚙ Mở Trang Kỹ Thuật (Playground R&D)</a>
    </div>

    <script>
        function processFeedback() {
            const val = document.getElementById('inputText').value.trim();
            if (!val) { alert('Vui lòng nhập phản hồi của khách hàng!'); return; }
            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
