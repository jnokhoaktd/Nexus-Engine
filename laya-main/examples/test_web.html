<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Thử Nghiệm Phân Tích Phản Hồi Khách Hàng</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 25px; background-color: #f1f5f9; color: #1e293b; }
        .container { max-width: 750px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { color: #0f172a; margin-top: 0; }
        p { color: #64748b; font-size: 14px; margin-bottom: 15px; }
        textarea { width: 100%; height: 110px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; box-sizing: border-box; resize: vertical; }
        button { background-color: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 12px; }
        button:hover { background-color: #1d4ed8; }
        .result-box { margin-top: 25px; padding: 20px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0; display: none; }
        .res-item { margin-bottom: 12px; font-size: 15px; }
        .res-label { font-weight: bold; color: #334155; }
        .tag { display: inline-block; padding: 4px 10px; border-radius: 6px; font-weight: 600; font-size: 13px; background: #e0f2fe; color: #0369a1; }
        .status { font-style: italic; color: #64748b; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Nexus Engine - Thử Nghiệm Ngôn Ngữ Tự Nhiên</h2>
        <p>Nhập hoặc dán trực tiếp câu phản hồi tiếng Việt của khách hàng để thử nghiệm mô hình:</p>
        
        <textarea id="feedbackText" placeholder="Ví dụ: Áo mỏng dính, mặc vào bị ngứa, may ẩu kinh khủng."></textarea>
        <button onclick="runAnalysis()">Phân Tích Bằng Nexus</button>

        <div id="status" class="status"></div>

        <div id="resultBox" class="result-box">
            <h3 style="margin-top:0; color:#0f172a;">Kết Quả Phân Tích Thực Tế:</h3>
            <div class="res-item">
                <span class="res-label">1. Vấn đề chính (complaint_type):</span> 
                <span id="resType" class="tag">-</span>
            </div>
            <div class="res-item">
                <span class="res-label">2. Mức độ hài lòng (sentiment):</span> 
                <span id="resSent" class="tag">-</span>
            </div>
            <div class="res-item">
                <span class="res-label">3. Ý định trả hàng (wants_return):</span> 
                <span id="resRet" class="tag">-</span>
            </div>
        </div>
    </div>

    <script>
        async function runAnalysis() {
            const text = document.getElementById('feedbackText').value.trim();
            const status = document.getElementById('status');
            const resultBox = document.getElementById('resultBox');

            if (!text) {
                alert('Vui lòng nhập nội dung phản hồi!');
                return;
            }

            status.innerText = 'Đang gửi dữ liệu tới Nexus Engine (http://127.0.0.1:8000/predict)...';
            resultBox.style.display = 'none';

            const payload = {
                "state": text,
                "questions": {
                    "complaint_type": {
                        "type": "choice",
                        "instructions": "What is the main issue in this product review?",
                        "criteria": {
                            "sizing_fit": "size, dimensions or fit is wrong",
                            "quality": "poor material, defects or broke quickly",
                            "shipping": "late, damaged in transit or missing items",
                            "instructions": "hard to assemble or unclear instructions",
                            "price_value": "not worth the price",
                            "no_issue": "no complaint"
                        }
                    },
                    "sentiment": {
                        "type": "score",
                        "instructions": "How satisfied is the customer?",
                        "criteria": ["very unhappy", "neutral", "dont care"]
                    },
                    "wants_return": {
                        "type": "noul",
                        "instructions": "Does the customer say they returned or want to return the product?"
                    }
                },
                "language": "vietnam"
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error('Lỗi máy chủ: ' + response.status);
                }

                const data = await response.json();
                status.innerText = 'Phân tích hoàn tất!';
                
                const ans = data.answers || {};
                
                // Hiển thị kết quả
                document.getElementById('resType').innerText = ans.complaint_type?.answer || ans.complaint_type?.choice || 'no_issue';
                document.getElementById('resSent').innerText = ans.sentiment?.answer || ans.sentiment?.value || 'neutral';
                document.getElementById('resRet').innerText = ans.wants_return?.answer !== undefined ? ans.wants_return.answer : 'false';

                resultBox.style.display = 'block';

            } catch (err) {
                status.innerText = 'Chưa kết nối được máy chủ Nexus hoặc lỗi API: ' + err.message;
            }
        }
    </script>
</body>
</html>
