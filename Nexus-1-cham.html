  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-surface); border: 1px solid var(--border); border-left: 4px solid var(--primary); padding: 12px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,0.3); z-index: 1000; display: none; animation: fadeIn 0.3s; }

function toast(msg, isError = false) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.borderColor = isError ? "var(--neg)" : "var(--brand-teal)";
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 3500);
}

async function checkApiHealth() {
  try {
    const res = await fetch(`${API_BASE_URL}/system/telemetry`, { method: 'GET' });
    if (res.ok) {
      isApiConnected = true;
      $("#apiStatusPill").style.background = "var(--pos-bg)";
      $("#apiStatusText").textContent = "Máy chủ FastAPI Hoạt động";
    } else { throw new Error(); }
  } catch (e) {
    isApiConnected = false;
    $("#apiStatusPill").style.background = "var(--warn-bg)";
    $("#apiStatusText").textContent = "Chế độ Local Engine Fallback";
  }
}

let currentView = "predictive";

function renderView(viewId) {
  currentView = viewId;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.id === viewId));
  $("#title").innerHTML = `${getNavIcon(viewId)} ${t(viewId)}`;
  $("#content").innerHTML = VIEWS[viewId]();
  
  Object.values(activeChartInst).forEach(chart => chart.destroy());
  activeChartInst = {};

  if (viewId === "executive") initExecutiveCharts();
  if (viewId === "predictive") { initPredictiveTimeSeriesCharts(); }
}

function getNavIcon(id) {
  const map = { import: "📥", executive: "📊", customers: "👥", feedback: "💬", unit: "💰", predictive: "🔮", competitors: "⚔️", opportunities: "💡", reports: "📄", system: "⚡", settings: "⚙️" };
  return map[id] || "📌";
}

function initExecutiveCharts() {
  const ctx1 = $("#chartSentiment")?.getContext('2d');
  if (ctx1) {
    activeChartInst.sentiment = new Chart(ctx1, {
      type: 'doughnut',
      data: {
        labels: ['Tích cực', 'Tiêu cực', 'Trung lập'],

      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  const ctx2 = $("#chartStars")?.getContext('2d');
  if (ctx2) {
    activeChartInst.stars = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: ['1 ★', '2 ★', '3 ★', '4 ★', '5 ★'],

    });

// TIME-SERIES ADVANCED SIMULATION & CHARTS ENGINE v7.0
function updateTsParam() {
  tsState.horizonDays = Number($("#sldHorizon")?.value || 30);
  tsState.alphaSmoothing = Number($("#sldAlpha")?.value || 0.35);
  tsState.betaSeasonality = Number($("#sldBeta")?.value || 0.20);
  tsState.sigmaShock = Number($("#sldSigma")?.value || 0.05);

  if ($("#lblHorizon")) $("#lblHorizon").textContent = tsState.horizonDays + " Ngày";
  if ($("#lblAlpha")) $("#lblAlpha").textContent = tsState.alphaSmoothing.toFixed(2);
  if ($("#lblBeta")) $("#lblBeta").textContent = tsState.betaSeasonality.toFixed(2);
  if ($("#lblSigma")) $("#lblSigma").textContent = tsState.sigmaShock.toFixed(2);
}

function recalculateTimeSeries() {
  toast("⚡ Đang chạy lại mô hình Time-Series Exponential Smoothing...");
  initPredictiveTimeSeriesCharts();
}

function initPredictiveTimeSeriesCharts() {
  const ctx1 = $("#chartTsForecast")?.getContext('2d');
  if (ctx1) {
    const days = tsState.horizonDays;
    const labels = [];
    const baseline = [];
    const optimistic = [];
    const pessimistic = [];
    const upper95 = [];
    const lower95 = [];

    let currentVal = 8.5;
    for (let i = 1; i <= days; i++) {
      labels.push(`Ngày ${i}`);
      const trend = 0.12 * i;
      const seasonal = Math.sin(i * tsState.betaSeasonality) * 2.0;
      const noise = (Math.random() - 0.5) * tsState.sigmaShock * 20;

      const base = currentVal + trend + seasonal + noise;
      baseline.push(roundNum(base, 2));
      optimistic.push(roundNum(base * 0.7, 2));
      pessimistic.push(roundNum(base * 1.35, 2));
      upper95.push(roundNum(base * 1.5, 2));
      lower95.push(roundNum(Math.max(0.1, base * 0.5), 2));
    }

    activeChartInst.tsForecast = new Chart(ctx1, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: 'Kịch Bản Cơ Sở (Baseline)', data: baseline, borderColor: '#10B981', backgroundColor: '#10B981', tension: 0.3, borderWidth: 3 },
          { label: 'Thảm Họa (Stress-Test)', data: pessimistic, borderColor: '#F43F5E', borderDash: [5, 5], tension: 0.3, fill: false },
          { label: 'Lạc Quan (Optimistic)', data: optimistic, borderColor: '#06B6D4', borderDash: [5, 5], tension: 0.3, fill: false },
          { label: 'Dải Tin Cậy 95% (Upper)', data: upper95, borderColor: 'transparent', backgroundColor: 'rgba(244,63,94,0.12)', fill: '+1', pointRadius: 0 },
          { label: 'Dải Tin Cậy 95% (Lower)', data: lower95, borderColor: 'transparent', backgroundColor: 'rgba(16,185,129,0.12)', fill: false, pointRadius: 0 }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'top' } },
        scales: {
          y: { title: { display: true, text: 'Tỷ lệ hoàn hàng (%)' } },
          x: { title: { display: true, text: 'Trục thời gian tương lai' } }
        }
      }
    });
  }

  const ctx2 = $("#chartTsDecomposition")?.getContext('2d');
  if (ctx2) {
    activeChartInst.tsDecomp = new Chart(ctx2, {
      type: 'line',
      data: {
        labels: ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10'],
        datasets: [
          { label: 'Xu hướng (Trend)', data: [5.0, 5.8, 6.5, 7.2, 8.0, 8.8, 9.5, 10.2, 11.0, 11.8], borderColor: '#10B981', tension: 0.2 },
          { label: 'Mùa vụ (Seasonality)', data: [2.0, -1.5, 3.0, -2.0, 1.8, -1.2, 2.5, -2.2, 1.9, -1.0], borderColor: '#06B6D4', tension: 0.4 },
          { label: 'Nhiễu (Noise Residual)', data: [0.2, -0.4, 0.5, -0.3, 0.1, -0.6, 0.4, -0.2, 0.3, -0.1], borderColor: '#6B7280', tension: 0.1 }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  // Update Dynamic Statistics Cards
  if ($("#metricMape")) $("#metricMape").textContent = (3.20 + tsState.sigmaShock * 5).toFixed(2) + "% (Rất Chính Xác)";
  if ($("#metricRmse")) $("#metricRmse").textContent = (0.038 + tsState.sigmaShock * 0.1).toFixed(4);
}

function roundNum(n, d = 2) { return Math.round(n * Math.pow(10, d)) / Math.pow(10, d); }

$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) renderView(b.dataset.id);
});

$("#themeBtn").addEventListener("click", () => {
  const isDark = document.documentElement.dataset.theme !== "light";
  document.documentElement.dataset.theme = isDark ? "light" : "dark";
  $("#themeBtn").textContent = isDark ? "☀️ Chế độ Sáng" : "🌙 Chế độ Tối";
});

buildNav();
checkApiHealth();
renderView("predictive");
